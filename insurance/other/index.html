<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기타 · 원세컨드 보험 지식</title>
<meta name="description" content="위 다섯 영역에 담기지 않는 보장 주제를 모읍니다. 원세컨드 보험 지식 공개 자료.">
<link rel="canonical" href="https://onesecond.solutions/insurance/other/">
<!-- 기존 SPA 카테고리와 픽셀 동일하게: 같은 CSS 3파일 링크 + 동일 마크업(#v-axis-medical + kc-*) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/css/knowledge-category.css?v=20260724b">
<link rel="stylesheet" href="/css/app-core.css?v=20260708">
<link rel="stylesheet" href="/css/app-views.css?v=20260708">
<style>
/* 셸(정적 공개 페이지 최소) — app.html 셸 대신. 토큰은 app-core.css. */
*{box-sizing:border-box;}
/* ⚠️ app-core.css의 body{height:100vh;overflow:hidden}(앱 셸 전용) override — 정적 페이지는 일반 문서 스크롤. */
html{height:auto!important;}
html,body{margin:0;padding:0;}
body{background:var(--bg);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--bodytx);-webkit-text-size-adjust:100%;height:auto!important;min-height:100vh;overflow:visible!important;}
a{color:inherit;}
/* 상단 우측 = 설계사 로그인(비로그인) */
.pub-top{display:flex;justify-content:flex-end;align-items:center;padding:16px 24px;}
.pub-login{display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:9999px;font-size:0.8125rem;font-weight:600;line-height:1;color:var(--ts);background:transparent;border:1px solid var(--bd);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s;}
.pub-login:hover{background:var(--s2);color:var(--tp);border-color:var(--tf);}
/* 카테고리 컨테이너 = knowledge-category.css의 #v-axis-medical.on{display:flex} 재현(.on 없이) */
#v-axis-medical{display:flex;flex-direction:column;min-height:0;padding:12px 24px 60px;}
/* 검색기 hs-* = app.html 인라인에서 이식(is-uat-homesearch2 값 기준) */
.kc-searchslot{margin-bottom:14px;flex-shrink:0;position:relative;}
.hs-box{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;position:relative;}
.hs-field{flex:1;display:flex;align-items:center;gap:10px;min-height:60px;height:60px;padding:0 16px;background:var(--s1);border:1.5px solid var(--bd);border-radius:22px;position:relative;min-width:0;}
.hs-field:focus-within{border-color:var(--ac);box-shadow:0 4px 18px rgba(99,102,241,.14);}
.hs-field svg{width:26px;height:26px;flex-shrink:0;color:var(--tf);}
.hs-field input{flex:1;border:0;outline:0;background:transparent;font-size:1.0625rem;color:var(--tp);min-width:0;}
.hs-field input::-webkit-search-cancel-button,.hs-field input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;}
.hs-go{height:60px;padding:0 22px;border:0;border-radius:22px;background:var(--ac);color:#fff;font-size:1.0625rem;font-weight:700;cursor:pointer;flex-shrink:0;}
.hs-go:hover{background:var(--ach);}
/* 검색기 좌측 시계 로고(홈 링크) */
.hs-homelogo{position:absolute;top:50%;right:100%;margin-right:14px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;z-index:2;}
.hs-homelogo-ic{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:0 0 auto;}
.hs-homelogo-tx{font-size:18px;font-weight:800;color:var(--tp);letter-spacing:-.01em;white-space:nowrap;}
@media(max-width:1120px){.hs-box{flex-wrap:wrap;justify-content:center;}.hs-homelogo{position:static;transform:none;right:auto;margin:0 0 12px;width:100%;justify-content:center;}}
@media(max-width:640px){.hs-field{min-height:56px;height:56px;}.hs-go{height:56px;padding:0 16px;}}
</style>
</head>
<body>
<div class="pub-top"><a class="pub-login" href="/app.html?view=home">설계사 로그인 <span aria-hidden="true">&#8594;</span></a></div>

<!-- 기존 SPA 카테고리(#v-axis-medical)와 동일 클래스 구조 → knowledge-category.css 그대로 적용 -->
<div id="v-axis-medical">
  <div class="kc-searchslot">
    <div class="hs-box">
      <a class="hs-homelogo" href="/app.html?view=home" title="원세컨드 홈">
        <img class="hs-homelogo-ic" src="/assets/images/logo/logo03.jpg" alt="원세컨드">
        <span class="hs-homelogo-tx">onesecond</span>
      </a>
      <div class="hs-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" placeholder="궁금한 보험이나 보장 내용을 검색해보세요" aria-label="공개 보험지식 검색">
      </div>
      <button class="hs-go" type="button">검색</button>
    </div>
  </div>
  <div class="tabs kc-tabs">
    <a class="tab" href="/insurance/silson/">의료실비<span class="kc-n">1</span></a>
    <a class="tab" href="/insurance/cancer/">암<span class="kc-n">1</span></a>
    <a class="tab" href="/insurance/brain-heart/">뇌 · 심장</a>
    <a class="tab" href="/insurance/surgery/">수술비</a>
    <a class="tab" href="/insurance/care-dementia/">간병 · 치매<span class="kc-n">1</span></a>
    <a class="tab on" href="/insurance/other/" aria-current="page">기타</a>
  </div>
  <div class="chips kc-chips"></div>
  <div class="kc-scroll"><div class="kc-body">
    <div class="kc-kicker">보장 영역</div>
    <h1 class="kc-h1">기타</h1>
    <div class="kc-hook">위 다섯 영역에 담기지 않는 보장 주제를 모읍니다.</div>
    <div class="kc-count">자료 0건</div>
    <div class="kc-rule"></div>
    <div class="kc-list">
      <div class="kc-empty"><div class="kc-empty-t">아직 등록된 공개 자료가 없습니다</div><div class="kc-empty-d">준비되는 대로 이곳에 올라옵니다.<br>다른 영역의 자료는 지금 보실 수 있습니다.</div></div>
    </div>
  </div></div>
</div>
</body>
</html>
