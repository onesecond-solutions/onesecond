*{box-sizing:border-box;}

html{height:auto!important;}
html,body{margin:0;padding:0;}
body{background:var(--bg);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--bodytx);-webkit-text-size-adjust:100%;height:auto!important;min-height:100vh;overflow:visible!important;}
a{color:inherit;}

.pub-top{display:flex;justify-content:flex-end;align-items:center;padding:16px 24px;}

.pub-login:hover{background:var(--s2);color:var(--tp);border-color:var(--tf);}
/* 로그인 상태(os_token 존재)면 설계사 로그인 숨김 — head 인라인이 html.is-authed 부여(FOUC 방지) */
html.is-authed .pub-top{display:none;}
/* 카테고리 컨테이너 = knowledge-category.css의 #v-axis-medical.on{display:flex} 재현(.on 없이) */

/* 검색기 hs-* = app.html 인라인에서 이식(is-uat-homesearch2 값 기준) */
.kc-searchslot{margin-bottom:14px;flex-shrink:0;position:relative;}
.hs-box{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;position:relative;}
.hs-field{flex:1;display:flex;align-items:center;gap:10px;min-height:60px;height:60px;padding:0 16px;background:var(--s1);border:1.5px solid var(--bd);border-radius:22px;position:relative;min-width:0;}
.hs-field:focus-within{border-color:var(--ac);box-shadow:0 4px 18px rgba(99,102,241,.14);}
.hs-field svg{width:26px;height:26px;flex-shrink:0;color:var(--tf);}
.hs-field input{flex:1;border:0;outline:0;background:transparent;font-size:1.0625rem;color:var(--tp);min-width:0;}
.hs-field input::-webkit-search-cancel-button,.hs-field input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;}
.hs-go{height:60px;padding:0 22px;border:0;border-radius:22px;background:var(--ac);color:#fff;font-size:1.0625rem;font-weight:700;cursor:pointer;flex-shrink:0;}
.hs-go:hover{background:var(--ach);}
/* 검색기 좌측 시계 로고(홈 링크) */
.hs-homelogo{position:absolute;top:50%;right:100%;margin-right:14px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;z-index:2;}
.hs-homelogo-ic{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:0 0 auto;}
.hs-homelogo-tx{font-size:18px;font-weight:800;color:var(--tp);letter-spacing:-.01em;white-space:nowrap;}
@media(max-width:1120px){.hs-box{flex-wrap:wrap;justify-content:center;}.hs-homelogo{position:static;transform:none;right:auto;margin:0 0 12px;width:100%;justify-content:center;}}
@media(max-width:640px){.hs-field{min-height:56px;height:56px;}.hs-go{height:56px;padding:0 16px;}}
