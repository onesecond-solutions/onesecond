<body class="iw-page">
  <header class="iw-header">
    <div class="iw-identity">
      <a class="iw-brand iw-brand-logo-only" href="/insuwork/" aria-label="보험워크 홈"><img class="iw-brand-logo" src="/insuwork/assets/brand/insurance-work-logo-ci.png?v=20260830ci" alt="보험워크"></a>
    </div>
    <label class="iw-global-search">⌕<input id="iw-search-input" type="search" placeholder="내 자료와 고객 검색" autocomplete="off" aria-label="내 자료와 고객 검색"></label>
    <div class="iw-header-actions">
      <div class="iw-account" id="iw-account"></div>
    </div>
  </header>
  <main class="iw-main body">
    <section id="v-insuwork" class="view on" aria-label="임태성 보험워크">
      <div class="iw-access"><strong>보험워크를 준비하고 있습니다.</strong><p>로그인 상태를 확인하는 중입니다.</p></div>
    </section>
  </main>
  <dialog class="iw-profile-dialog" id="iw-profile-dialog" aria-labelledby="iw-profile-title">
    <form method="dialog" id="iw-profile-form">
      <div class="iw-profile-head">
        <div><strong id="iw-profile-title">개인정보 수정</strong><p>보험워크에서 사용할 기본 정보를 관리합니다.</p></div>
        <button type="button" class="iw-profile-close" aria-label="닫기">×</button>
      </div>
      <label>이름<input type="text" id="iw-profile-name" autocomplete="name" maxlength="30" required></label>
      <label>연락처<input type="tel" id="iw-profile-phone" autocomplete="tel" maxlength="20"></label>
      <label>닉네임(선택)<input type="text" id="iw-profile-nickname" autocomplete="off" maxlength="30" placeholder="공개자료실에 표시할 이름 (비워두면 익명)"></label>
      <p class="iw-profile-message" id="iw-profile-message" role="status"></p>
      <div class="iw-profile-actions"><button type="button" class="iw-profile-cancel">취소</button><button type="submit" class="iw-profile-save">저장</button></div>
    </form>
  </dialog>
