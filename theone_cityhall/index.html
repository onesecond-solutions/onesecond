    <style id="cityhall-overrides">
      /* 더원 시청팀 — 데이폴더 복사본 UI 수정 (2026-08-03) */
      .brand-actions{display:none !important;}                      /* 웹에서 사용중 · 다운로드 */
      .weather-summary,.time-summary{display:none !important;}       /* 검색기 우측 시간 */
      .background-button{display:none !important;}                   /* 배경 보기 */
      .brand-copy small{display:none !important;}                    /* 데이폴더 부제 문구 */
      .tone-mode-actions button:first-child{display:none !important;} /* 화면 모드 '배경' 옵션 */
      /* 날짜 원클릭 → 일정 바로: 파일/메모/일정 선택 팝오버를 감춤(DOM엔 잠깐 마운트, 아래 스크립트가 일정 버튼을 프로그램적으로 클릭) */
      .date-quick-popover,.quick-popover-backdrop{display:none !important;}

      /* 상세(목록) 패널 세로 스크롤 복구 — 번들 기본 .detail-panel{overflow-y:hidden}이라 긴 내용(스크립트 등)의 아래가 잘려 안 보임. 스크롤 허용. (2026-08-04) */
      .detail-panel{ overflow-y:auto !important; }

      /* 노트 편집기: 제목 입력란 제거 — 내용(.rich-editor) 첫 줄이 제목이 됨(아래 스크립트가 숨긴 제목 input에 반영). (2026-08-04) */
      .rich-note-heading > input{ display:none !important; }

      /* ── 일정/메모 작성창(.composer)을 넓은 2열 가로 레이아웃으로 → 세로 스크롤 제거 (2026-08-04) ──
         번들 기본: .composer{width:500px;max-height:calc(100vh-40px);overflow-y:auto} → 폭 좁고 필드가 세로로 길어 스크롤 발생.
         직계 자식(순서): span.eyebrow · h2 · label(제목·숨김) · [일정] fieldset.schedule-dates · label.all-day-toggle · fieldset.schedule-times(비하루종일 시) · fieldset.color-picker · label(내용/textarea) · div.attachment-picker · div.form-actions.
         (메모 작성창은 label(날짜)가 대신 들어가고 필드가 적어 같은 규칙에서 자연스럽게 배치됨.) */

      /* (A) 제목 입력란 제거 — 내용 첫 줄이 제목이 되므로(아래 스크립트) 제목칸은 숨긴다(메모/일정 공통).
         display:none 이면 그리드 흐름에서도 완전히 빠져 아래 명시 행번호 배치가 어긋나지 않는다. */
      .composer > label:has(input[placeholder*="제목"]){ display:none !important; }

      .composer{
        width:min(900px,calc(100vw - 42px)) !important;   /* 넓게 */
        max-height:none !important;                        /* 세로 스크롤 제거 */
        overflow:visible !important;
        display:grid !important;                           /* 2열 그리드 */
        grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
        gap:14px 22px !important;
        align-content:start !important;
      }
      /* gap이 행 간격을 담당 → 자식 개별 top-margin 제거로 2열 정렬을 균일하게 */
      .composer > .eyebrow,
      .composer > h2,
      .composer > label,
      .composer > fieldset,
      .composer > .attachment-picker,
      .composer > .form-actions{ margin-top:0 !important; }
      .composer > h2{ margin-bottom:0 !important; }

      /* (C) 좌우 높이 정렬 배치
         전열 span: 날짜(eyebrow) · 제목heading(h2) · 내용(textarea 든 label) · 첨부 · 버튼줄.
         제목칸이 숨겨졌으므로 eyebrow=1행, h2=2행, 이후 필드는 3행부터 시작한다.
         왼쪽 열: 기간(3행) → 하루종일(4행) → (해제 시) 시간(5행).
         오른쪽 열: 색상 팔레트를 3~4행(기간+하루종일)에 걸쳐 세로 span하고 stretch로 높이를 맞춘다. */
      .composer > .eyebrow,
      .composer > h2,
      .composer > .attachment-picker,
      .composer > .form-actions{ grid-column:1 / -1 !important; }
      .composer > label:has(textarea){ grid-column:1 / -1 !important; }

      /* 왼쪽 열(명시 행번호로 고정 — schedule-times 유무와 무관하게 색상 span이 어긋나지 않게) */
      .composer > .schedule-dates{ grid-column:1 !important; grid-row:3 !important; }
      .composer > .all-day-toggle{ grid-column:1 !important; grid-row:4 !important; align-self:center !important; }
      .composer > .schedule-times{ grid-column:1 !important; grid-row:5 !important; }  /* 하루종일 해제 시 왼쪽 열에 이어짐 */

      /* 오른쪽 열: 색상 = 기간+하루종일(3~4행) 영역에 세로 '중앙정렬'.
         박스는 스와치에 딱 맞는 자연 높이로 두고(억지 stretch 제거), 남는 세로 여백은 박스 밖(위/아래)에 균등 분배.
         → 스와치 두 줄은 번들 기본의 고른 간격을 유지하고, 박스가 왼쪽 섹션 가운데에 놓여 균형이 맞는다. */
      .composer > .color-picker{
        grid-column:2 !important;
        grid-row:3 / span 2 !important;
        align-self:center !important;
      }
      /* 색상 내부 스와치 컨테이너(.color-picker>div)는 번들 기본(8열·고른 간격) 그대로 — 세로로 벌리지 않는다. */

      /* 좁은 화면: 1열로 복귀 + 안전하게 스크롤 허용 (명시 행번호·span 해제) */
      @media (max-width:640px){
        .composer{
          grid-template-columns:1fr !important;
          overflow-y:auto !important;
          max-height:calc(100vh - 40px) !important;
        }
        .composer > .schedule-dates,
        .composer > .all-day-toggle,
        .composer > .schedule-times,
        .composer > .color-picker{
          grid-column:1 !important;
          grid-row:auto !important;
        }
        .composer > .color-picker{ align-self:start !important; }
      }
    </style>
    <script>
      (function () {
        /* 배경(scene) 모드 미사용 — 화이트/다크만. tone-mode 저장을 cityhall 전용 키로 격리(데이폴더 원본 무영향), 미설정·scene은 화이트로 강제. 앱이 읽기 전 설치(모듈 스크립트는 deferred). */
        try {
          var OK = "dayfolder-tone-mode", CK = "cityhall-tone-mode";
          var _get = localStorage.getItem.bind(localStorage), _set = localStorage.setItem.bind(localStorage);
          localStorage.getItem = function (k) { if (k === OK) { var v = _get(CK); return (v === "light" || v === "dark") ? v : "light"; } return _get(k); };
          localStorage.setItem = function (k, v) { if (k === OK) { return _set(CK, (v === "light" || v === "dark") ? v : "light"); } return _set(k, v); };
        } catch (e) {}
        function apply() {
          try {
            var strong = document.querySelector(".brand-copy strong");
            if (strong && strong.textContent !== "더원 시청팀") strong.textContent = "더원 시청팀";
            var ds = document.querySelector(".data-settings");
            if (ds) {
              Array.prototype.slice.call(ds.children).forEach(function (row) {
                if (/자료 백업 및 복원|백업 불러오기|자료 내보내기/.test(row.textContent || "")) row.style.display = "none";
              });
            }
            if (document.title !== "더원 시청팀") document.title = "더원 시청팀";
          } catch (e) {}
        }
        apply();
        try {
          var root = document.getElementById("root") || document.body;
          new MutationObserver(apply).observe(root, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
    <script>
      /* 날짜 한 번 클릭 → '파일/메모/일정' 선택 팝오버 대신 곧바로 '일정' 작성창을 연다.
         원리: 앱은 단일 클릭 시 .date-quick-popover 를 마운트한다(위 CSS로 숨김). 그 순간을 감지해
         팝오버 안의 '일정' 버튼을 프로그램적으로 .click() → 앱 자체 일정 작성 로직 실행.
         더블클릭도 앱이 원래 '일정' 창을 열므로, 단일·더블 모두 '일정' 창으로 통일된다.
         더블클릭 시 앱이 여는 창과 중복으로 두 번 열리지 않도록, 감지 후 지연을 두고 최근 더블클릭 여부를 확인해 스킵한다. */
      (function () {
        try {
          var lastDbl = 0;
          document.addEventListener("dblclick", function () { lastDbl = Date.now(); }, true);

          function composerOpen() {
            return !!document.querySelector(".composer, .composer-modal-backdrop");
          }

          function handlePopover(pop) {
            if (!pop || pop.__cityhallOneclick) return;
            pop.__cityhallOneclick = true;            /* 같은 팝오버 중복 처리 방지 */
            setTimeout(function () {
              try {
                /* 더블클릭이었으면(최근 400ms 내) 앱이 여는 일정 창을 그대로 두고 개입 안 함(중복 오픈 방지) */
                if (Date.now() - lastDbl < 400) return;
                /* 팝오버가 이미 사라졌으면(닫힘) 개입 안 함 */
                if (!document.body.contains(pop)) return;
                /* 이미 작성창이 열려 있으면 중복 클릭 안 함 */
                if (composerOpen()) return;
                var actions = pop.querySelector(".quick-popover-actions") || pop;
                var btns = Array.prototype.slice.call(actions.querySelectorAll("button"));
                var sched = btns.filter(function (b) { return /일정/.test(b.textContent || ""); })[0];
                if (sched) sched.click();
              } catch (e) {}
            }, 240);
          }

          function scan(node) {
            if (!node || node.nodeType !== 1) return;
            if (node.classList && (node.classList.contains("date-quick-popover") || node.classList.contains("quick-popover-actions"))) {
              handlePopover(node.closest ? (node.closest(".date-quick-popover") || node) : node);
              return;
            }
            var pop = node.querySelector && node.querySelector(".date-quick-popover");
            if (pop) handlePopover(pop);
          }

          var root = document.getElementById("root") || document.body;
          new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
              var added = muts[i].addedNodes;
              for (var j = 0; j < added.length; j++) scan(added[j]);
            }
          }).observe(root, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
    <script>
      /* (B) 제목칸을 숨겼으므로(위 CSS), 저장 시 제목이 비지 않도록
         '내용' textarea의 첫 줄을 (숨겨진) 제목 input 에 실시간 반영한다.
         React 제어 컴포넌트라 input.value=... 직접 대입은 무시되므로,
         네이티브 value setter + input 이벤트로 상태를 갱신한다. */
      (function () {
        try {
          function setReactInputValue(input, value) {
            try {
              var proto = window.HTMLInputElement.prototype;
              var setter = Object.getOwnPropertyDescriptor(proto, "value").set;
              setter.call(input, value);
              input.dispatchEvent(new Event("input", { bubbles: true }));
            } catch (e) {}
          }

          document.addEventListener(
            "input",
            function (ev) {
              try {
                var t = ev.target;
                if (!t || t.tagName !== "TEXTAREA") return;
                var composer = t.closest && t.closest(".composer");
                if (!composer) return;
                var title = composer.querySelector('input[placeholder*="제목"]');
                if (!title) return;
                var first = (t.value.split("\n")[0] || "").trim();
                if (!first) first = "제목 없음"; /* 첫 줄이 비면 안전값(제목 필수 저장 대비) */
                if (title.value !== first) setReactInputValue(title, first);
              } catch (e) {}
            },
            true /* capture: React 위임 리스너보다 먼저 관측 */
          );

          /* 내용 textarea placeholder 안내(선택) — 앱 재렌더로 되돌아갈 수 있어 가볍게 시도만. */
          function hintPlaceholder() {
            try {
              var ta = document.querySelector(".composer label:has(textarea) textarea, .composer textarea");
              if (ta && ta.placeholder && ta.placeholder.indexOf("첫 줄") === -1) {
                ta.placeholder = "첫 줄이 제목이 됩니다 · 내용을 적으세요";
              }
            } catch (e) {}
          }
          document.addEventListener("click", function () { setTimeout(hintPlaceholder, 60); }, true);
        } catch (e) {}
      })();
    </script>
    <script>
      /* '+N개 더보기'(small.more-items) 클릭 → 날짜 원클릭 오버라이드(일정 작성창)가 뜨던 회귀 교정.
         .more-items는 자체 클릭 핸들러가 없어 날짜셀로 전파되어 팝오버→일정창이 떴다.
         올바른 동작: 그 날짜의 '목록'을 오른쪽 상세 패널에 연다.
         방식: capture 단계에서 셀 전파를 차단(팝오버/일정창 방지) → 같은 셀 첫 칩(.day-item) 클릭(날짜 선택+상세 오픈) → '← 목록'(.back-button)으로 목록 모드 전환. (2026-08-04) */
      (function () {
        try {
          document.addEventListener("click", function (ev) {
            var more = ev.target && ev.target.closest && ev.target.closest(".more-items");
            if (!more) return;
            ev.preventDefault();
            ev.stopImmediatePropagation();               /* 셀 onClick 도달 차단 → 팝오버/일정창 안 뜸 */
            try {
              var box = more.closest(".day-items") || more.parentElement;
              var chip = box && box.querySelector(".day-item");
              if (chip) {
                chip.click();                             /* 그 날짜 선택 + 항목 상세 오픈 */
                setTimeout(function () {
                  var back = document.querySelector(".detail-panel .back-button");
                  if (back) back.click();                 /* 목록 모드 → 그 날짜 전체 리스트 */
                }, 30);
              }
            } catch (e) {}
          }, true);
        } catch (e) {}
      })();
    </script>
    <script>
      /* 노트 편집기: 제목 입력란을 숨겼으므로(위 CSS), 내용(.rich-editor, contenteditable) 첫 줄을
         숨긴 제목 input(.rich-note-heading > input)에 실시간 반영해 그 줄이 제목이 되게 한다.
         React 제어 input이라 네이티브 value setter + input 이벤트로 상태(H1({title}))를 갱신. (2026-08-04) */
      (function () {
        function setReactInputValue(input, value) {
          try {
            var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            setter.call(input, value);
            input.dispatchEvent(new Event("input", { bubbles: true }));
          } catch (e) {}
        }
        try {
          document.addEventListener("input", function (ev) {
            try {
              var t = ev.target;
              var ed = t && ((t.classList && t.classList.contains("rich-editor")) ? t : (t.closest && t.closest(".rich-editor")));
              if (!ed) return;
              var heading = document.querySelector(".rich-note-heading");
              var title = heading && heading.querySelector("input");
              if (!title) return;
              var first = ((ed.innerText || ed.textContent || "").split("\n")[0] || "").trim();
              if (!first) first = "제목 없음";
              if (title.value !== first) setReactInputValue(title, first);
            } catch (e) {}
          }, true);
        } catch (e) {}
      })();
    </script>
