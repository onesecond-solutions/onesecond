    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #f7fbfb;
      }

      .boot-splash {
        display: grid;
        min-height: 100%;
        place-items: center;
        background:
          radial-gradient(circle at 70% 20%, rgba(191, 231, 226, .8), transparent 32%),
          linear-gradient(180deg, #f7fbfb, #eef8f6 70%, #fbfaf5);
        color: #16344a;
        font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", Arial, sans-serif;
      }

      .boot-card {
        display: grid;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }

      .boot-logo {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(145deg, #2f8589, #28656d);
        color: #fff;
        box-shadow: 0 16px 34px rgba(47, 133, 137, .25);
        font-size: 22px;
        font-weight: 800;
        animation: dayfolder-boot 1.15s ease-in-out infinite;
      }

      .boot-card strong {
        font-size: 22px;
        font-weight: 850;
      }

      .boot-card span {
        color: #61717c;
        font-size: 14px;
        font-weight: 650;
      }

      @keyframes dayfolder-boot {
        50% {
          transform: translateY(-5px);
        }
      }
    </style>
    <title>데이폴더 - 날짜별 파일·메모 캘린더</title>

  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-logo">▣</div>
          <strong>데이폴더를 여는 중</strong>
          <span>오늘의 자료를 불러오고 있습니다.</span>
        </div>
      </div>
    </div>
    <style id="cityhall-overrides">
      /* 더원 시청팀 — 데이폴더 복사본 UI 수정 (2026-08-03) */
      .brand-actions{display:none !important;}                      /* 웹에서 사용중 · 다운로드 */
      .weather-summary,.time-summary{display:none !important;}       /* 검색기 우측 시간 */
      .background-button{display:none !important;}                   /* 배경 보기 */
      .brand-copy small{display:none !important;}                    /* 데이폴더 부제 문구 */
      .tone-mode-actions button:first-child{display:none !important;} /* 화면 모드 '배경' 옵션 */
    </style>
    <script>
      (function () {
        function apply() {
          try {
            var strong = document.querySelector(".brand-copy strong");
            if (strong && strong.textContent !== "더원 시청팀") strong.textContent = "더원 시청팀";
            var ds = document.querySelector(".data-settings");
            if (ds) {
              Array.prototype.slice.call(ds.children).forEach(function (row) {
                if (/자료 백업 및 복원|백업 불러오기|자료 내보내기/.test(row.textContent || "")) row.style.display = "none";
              });
            }
            if (document.title !== "더원 시청팀") document.title = "더원 시청팀";
          } catch (e) {}
        }
        apply();
        try {
          var root = document.getElementById("root") || document.body;
          new MutationObserver(apply).observe(root, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
  </body>
