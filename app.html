<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 2026-08-02: /app.html → /insu/ 경로 전환. 옛 북마크(app.html?view=... 등) 보존용 리다이렉트 스텁.
     실제 앱 본체는 /insu/index.html. 쿼리스트링·해시를 보존해 그대로 넘긴다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>원세컨드로 이동 중...</title>
<link rel="canonical" href="/insu/">
<script>location.replace('/insu/' + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0;url=/insu/"></noscript>
</head>
<body>
<noscript>
  <p>원세컨드로 이동하려면 <a href="/insu/">여기를 클릭</a>하세요.</p>
</noscript>
</body>
</html>
