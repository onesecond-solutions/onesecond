name: Insurance issue search index
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum files to index in this run
        default: '200'
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: briefing-leaflet-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Index new insurance issue files
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INDEX_LIMIT: ${{ inputs.limit || '8' }}
          INDEX_CONCURRENCY: '2'
        run: node scripts/insuwork-index-briefing-leaflets.mjs
