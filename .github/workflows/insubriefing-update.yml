name: InsuBriefing daily update
on:
  workflow_dispatch:
  schedule:
    # KST 05:17 / 06:17 / 07:17. 성공 후 중복 수집을 건너뛰고 실패 때 재시도.
    - cron: '17 20,21,22 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: insubriefing-daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check today's published briefing
        id: freshness
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {kstDay} from './insuwork/insubriefing/scripts/briefing-core.mjs';
          let current = false;
          try {
            const local=JSON.parse(fs.readFileSync('insuwork/insubriefing/data/briefing-latest.json','utf8'));
            const r=await fetch('https://onesecond.solutions/insuwork/insubriefing/data/briefing-latest.json?check='+Date.now(),{signal:AbortSignal.timeout(15000)});
            const live=await r.json();
            current=r.ok && local.date===kstDay() && local.updatedAt===live.updatedAt && live.items?.length>0;
          } catch {}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`current=${current}\n`);
          NODE
      - name: Collect customer briefing
        if: steps.freshness.outputs.current != 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node insuwork/insubriefing/scripts/update-content.mjs
      - name: Update legacy briefing references
        if: steps.freshness.outputs.current != 'true'
        run: node insuwork/insubriefing/scripts/update-library.mjs
      - name: Save briefing and daily archive
        if: steps.freshness.outputs.current != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add insuwork/insubriefing/data
          if ! git diff --cached --quiet; then
            git commit -m 'chore(insuwork): update daily customer briefing'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Request Pages deployment explicitly
        if: steps.freshness.outputs.current != 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Verify live briefing
        if: steps.freshness.outputs.current != 'true' && github.ref_name == 'main'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected=JSON.parse(fs.readFileSync('insuwork/insubriefing/data/briefing-latest.json','utf8'));
          for(let i=0;i<36;i++) {
            try {
              const r=await fetch('https://onesecond.solutions/insuwork/insubriefing/data/briefing-latest.json?verify='+Date.now(),{signal:AbortSignal.timeout(10000)});
              const live=await r.json();
              if(r.ok && live.updatedAt===expected.updatedAt && live.items?.length) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`게시 확인: ${live.date}, ${live.items.length}건, ${live.updatedAt}\n`);
                process.exit(0);
              }
            } catch {}
            await new Promise(r=>setTimeout(r,10000));
          }
          throw new Error('라이브 갱신 확인 실패: 저장 결과와 배포 데이터가 다릅니다.');
          NODE
      - name: Report failed update
        if: failure()
        run: echo '자동 갱신 실패. 마지막 정상 기사는 유지됩니다. 실행 로그를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
