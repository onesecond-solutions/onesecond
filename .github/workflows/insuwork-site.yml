name: Deploy Insurance Work subdomain
on:
  push:
    branches: [main]
    paths:
      - 'insuwork/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'data/**'
      - 'downloads/**'
      - 'insurance/**'
      - 'insu/**'
      - 'insubriefing/**'
      - 'pages/**'
      - '*.html'
      - 'scripts/build-insuwork-site.mjs'
      - '.github/workflows/insuwork-site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insuwork-subdomain
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from canonical source
        run: node scripts/build-insuwork-site.mjs . dist/insuwork-site
      - uses: actions/checkout@v4
        with:
          repository: onesecond-solutions/insuwork-site
          ref: main
          path: deploy-target
          ssh-key: ${{ secrets.INSUWORK_SITE_DEPLOY_KEY }}
      - name: Publish generated static files
        run: |
          rsync -a --delete --exclude=.git dist/insuwork-site/ deploy-target/
          cd deploy-target
          git config user.name 'Insurance Work deploy'
          git config user.email 'deploy@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Insurance Work from ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
