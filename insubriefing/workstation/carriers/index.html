<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f8fafd">
  <title>원전산 바로가기 | 보험브리핑</title>
  <link rel="stylesheet" href="/css/app-core.css?v=20260708">
  <link rel="stylesheet" href="/css/tokens-v2.css?v=20260817darkmode">
  <link rel="stylesheet" href="../workstation.css?v=20260821namsan">
  <link rel="stylesheet" href="../../account-menu.css?v=20260821wide">
  <link rel="stylesheet" href="./carriers.css?v=20260821">
  <script src="/js/db.js"></script>
  <script src="/js/auth.js"></script>
  <script defer src="../workstation.js?v=20260821namsan"></script>
  <script defer src="../../weather-widget.js?v=20260821weather"></script>
  <script defer src="./carriers.js?v=20260821"></script>
</head>
<body class="ws-page carrier-page">
  <header class="ws-header">
    <div class="ws-identity">
      <a class="ws-brand" href="/insubriefing/" aria-label="보험브리핑 홈"><span>B</span><strong>보험브리핑</strong></a>
      <span class="ws-divider" aria-hidden="true"></span>
      <a class="ws-product carrier-workstation-link" href="/insubriefing/workstation/">워크스테이션</a>
    </div>
    <div class="ws-account" id="ws-account"></div>
  </header>
  <main class="carrier-main">
    <section id="carrier-app" aria-labelledby="carrier-title">
      <div class="carrier-head">
        <div>
          <a class="carrier-back" href="/insubriefing/workstation/">← 워크스테이션</a>
          <p class="carrier-kicker">SALES SYSTEM</p>
          <h1 id="carrier-title">원전산 바로가기</h1>
          <p>보험사 설계 시스템을 빠르게 찾고 새 창으로 실행합니다.</p>
        </div>
        <label class="carrier-search"><span aria-hidden="true">⌕</span><input id="carrier-search" type="search" placeholder="보험사 검색" autocomplete="off" aria-label="보험사 검색"></label>
      </div>
      <div class="carrier-tabs" role="tablist" aria-label="보험사 구분">
        <button type="button" role="tab" data-carrier-tab="nonlife" aria-selected="true">손해보험 <span id="carrier-count-nonlife">0</span></button>
        <button type="button" role="tab" data-carrier-tab="life" aria-selected="false">생명보험 <span id="carrier-count-life">0</span></button>
      </div>
      <div class="carrier-status" id="carrier-status" role="status">보험사 정보를 불러오는 중입니다.</div>
      <div class="carrier-grid" id="carrier-grid"></div>
    </section>
  </main>
  <dialog class="ws-profile-dialog" id="ws-profile-dialog" aria-labelledby="ws-profile-title">
    <form method="dialog" id="ws-profile-form">
      <div class="ws-profile-head"><div><strong id="ws-profile-title">개인정보 수정</strong><p>워크스테이션에서 사용할 기본 정보를 관리합니다.</p></div><button type="button" class="ws-profile-close" aria-label="닫기">×</button></div>
      <label>이름<input type="text" id="ws-profile-name" autocomplete="name" maxlength="30" required></label>
      <label>연락처<input type="tel" id="ws-profile-phone" autocomplete="tel" maxlength="20"></label>
      <p class="ws-profile-message" id="ws-profile-message" role="status"></p>
      <div class="ws-profile-actions"><button type="button" class="ws-profile-cancel">취소</button><button type="submit" class="ws-profile-save">저장</button></div>
    </form>
  </dialog>
</body>
</html>
