    <link rel="icon" type="image/png" href="/dayfolder/app/icon-192.png" />

    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f7fbfb; }
    </style>
    <title>데이폴더 설계사 버전</title>
    <script>
      const dayfolderAdvisorUrl = new URL(window.location.href);
      dayfolderAdvisorUrl.searchParams.delete("edition");
      dayfolderAdvisorUrl.searchParams.delete("mode");
      dayfolderAdvisorUrl.searchParams.delete("advisor");
      window.history.replaceState(
        null,
        "",
        `${dayfolderAdvisorUrl.pathname}${dayfolderAdvisorUrl.search}${dayfolderAdvisorUrl.hash}`
      );

      const dayfolderSearchParamGet = URLSearchParams.prototype.get;
      URLSearchParams.prototype.get = function (name) {
        if (
          (name === "edition" || name === "mode") &&
          window.location.pathname.startsWith("/dayfolder-advisor")
        ) {
          return "advisor";
        }
        return dayfolderSearchParamGet.call(this, name);
      };
    </script>
