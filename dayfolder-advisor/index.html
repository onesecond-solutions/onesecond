<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="데이폴더 설계사 버전" />
    <link rel="canonical" href="https://onesecond.solutions/dayfolder-advisor/" />
    <link rel="icon" type="image/png" href="/dayfolder/app/icon-192.png" />
    <link rel="shortcut icon" href="/dayfolder/app/favicon.ico" />
    <link rel="apple-touch-icon" href="/dayfolder/app/icon-192.png" />
    <link rel="stylesheet" href="/dayfolder-advisor/auth.css" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f7fbfb; }
    </style>
    <title>데이폴더 설계사 버전</title>
    <script>
      const dayfolderAdvisorUrl = new URL(window.location.href);
      dayfolderAdvisorUrl.searchParams.delete("edition");
      dayfolderAdvisorUrl.searchParams.delete("mode");
      dayfolderAdvisorUrl.searchParams.delete("advisor");
      window.history.replaceState(
        null,
        "",
        `${dayfolderAdvisorUrl.pathname}${dayfolderAdvisorUrl.search}${dayfolderAdvisorUrl.hash}`
      );

      const dayfolderSearchParamGet = URLSearchParams.prototype.get;
      URLSearchParams.prototype.get = function (name) {
        if (
          (name === "edition" || name === "mode") &&
          window.location.pathname.startsWith("/dayfolder-advisor")
        ) {
          return "advisor";
        }
        return dayfolderSearchParamGet.call(this, name);
      };
    </script>
    <script>
      (() => {
        const refreshKey = "dayfolder-latest-bundle";
        let checking = false;
        async function checkForUpdate() {
          if (checking || document.visibilityState === "hidden") return;
          checking = true;
          try {
            const current = document.querySelector('script[type="module"][src]')?.src;
            const checkUrl = new URL(location.pathname, location.origin);
            checkUrl.searchParams.set("__dayfolder_version", String(Date.now()));
            const response = await fetch(checkUrl, { cache: "no-store" });
            if (!response.ok || !current) return;
            const html = await response.text();
            const latestPath = new DOMParser().parseFromString(html, "text/html").querySelector('script[type="module"][src]')?.getAttribute("src");
            if (!latestPath) return;
            const latest = new URL(latestPath, location.origin).href;
            if (latest === current) { sessionStorage.removeItem(refreshKey); return; }
            if (sessionStorage.getItem(refreshKey) === latest) return;
            sessionStorage.setItem(refreshKey, latest);
            const nextUrl = new URL(location.href);
            nextUrl.searchParams.set("__dayfolder_refresh", latestPath.split("/").pop() || String(Date.now()));
            location.replace(nextUrl);
          } catch {} finally { checking = false; }
        }
        window.addEventListener("focus", checkForUpdate);
        window.addEventListener("pageshow", checkForUpdate);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });
        window.setInterval(checkForUpdate, 60_000);
        window.setTimeout(checkForUpdate, 1_500);
      })();
    </script>
    <script type="module" crossorigin src="/dayfolder/app/assets/index-DOEYHuJ6.js"></script>
    <link rel="stylesheet" crossorigin href="/dayfolder/app/assets/index-D7KkU9_r.css" />

    <script defer src="/dayfolder/app/solar-terms.js?v=2"></script>
    <link rel="stylesheet" href="/dayfolder/app/detail-resize.css?v=3" />
    <script defer src="/dayfolder/app/detail-resize.js?v=2"></script>
    <script defer src="/dayfolder-advisor/auth.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
